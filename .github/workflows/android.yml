name: Android Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

# Needed to create releases and upload assets with the built-in token.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission
        run: chmod +x android/gradlew

      - name: Read version
        id: version
        run: |
          version=$(grep -m1 'versionName' android/app/build.gradle.kts \
            | sed 's/.*"\(.*\)".*/\1/')
          echo "Android version: $version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: cd android && ./gradlew assembleDebug

      - name: Rename APK
        run: |
          src=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          cp "$src" "vcamdroid-${{ steps.version.outputs.value }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: vcamdroid-*.apk

      # Puts the APK on the Releases tab:
      #   - a tag push (v1.2.3) publishes a release for that tag
      #   - a push to the default branch refreshes the rolling "latest" release
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          apk="vcamdroid-${version}.apk"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            echo "Publishing $apk to release $tag"
            gh release view "$tag" >/dev/null 2>&1 \
              || gh release create "$tag" --title "VCamdroid $tag" \
                   --notes "Android build $version"
            gh release upload "$tag" "$apk" --clobber
          else
            echo "Publishing $apk to the rolling 'latest' release"
            gh release view latest >/dev/null 2>&1 \
              || gh release create latest --title "Latest build" \
                   --notes "Automatically built from the default branch."

            # Keep exactly one APK in the rolling release instead of one per version.
            for asset in $(gh release view latest --json assets --jq '.assets[].name'); do
              gh release delete-asset latest "$asset" --yes
            done

            gh release edit latest \
              --title "Latest build (v${version})" \
              --notes "Android $version — run #${{ github.run_number }}, commit ${GITHUB_SHA:0:7}."
            gh release upload latest "$apk" --clobber
          fi
